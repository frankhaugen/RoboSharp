# Pull requests and pushes to main: Release build, full test suite, TRX (Microsoft.Testing.Platform),
# self-contained RoboSharp.Studio linux-x64 + win-x64 CI artifacts, and verification that
# RoboSharp.slnx and docs/diagrams match the generators (see docs/build.md).
# Pushes to main also create a prerelease with Studio / Player / Web archives (see publish-release job).
# Calendar-style version tags still use release.yml.

name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json', 'RoboSharp.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore, build, test, verify generated files
        uses: ./.github/actions/robo-build-verify

      - name: Upload test results (TRX)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test-results-${{ github.run_id }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: warn
          retention-days: 28

      - name: Publish RoboSharp.Studio (self-contained)
        if: success()
        shell: bash
        env:
          STUDIO_CI_OUT: ${{ runner.temp }}/studio-ci
        run: |
          set -euo pipefail
          VERSION="0.0.0-ci.${{ github.run_number }}"
          mkdir -p "$STUDIO_CI_OUT/linux-x64" "$STUDIO_CI_OUT/win-x64"
          dotnet publish src/RoboSharp.Studio/RoboSharp.Studio.csproj \
            --configuration Release \
            --runtime linux-x64 \
            -p:Version="${VERSION}" \
            -p:RoboSharpSingleFilePublish=true \
            -o "$STUDIO_CI_OUT/linux-x64"
          dotnet publish src/RoboSharp.Studio/RoboSharp.Studio.csproj \
            --configuration Release \
            --runtime win-x64 \
            -p:Version="${VERSION}" \
            -p:RoboSharpSingleFilePublish=true \
            -o "$STUDIO_CI_OUT/win-x64"
          {
            echo "# RoboSharp.Studio CI build (${VERSION})"
            echo ""
            echo "- **linux-x64:** self-contained bundle \`RoboSharp.Studio\` (no \`.exe\`)"
            echo "- **win-x64:** self-contained \`RoboSharp.Studio.exe\`"
            echo ""
            echo "Same publish switches as release packaging; for tagged releases use \`release.yml\`."
          } > "$STUDIO_CI_OUT/README.md"

      - name: Upload RoboSharp.Studio CI binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: studio-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/studio-ci/
          retention-days: 14

      - name: Job summary
        if: success()
        shell: bash
        run: |
          {
            echo "### CI passed"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Configuration | Release |"
            echo "| Solution | \`RoboSharp.slnx\` |"
            echo "| Generated \`RoboSharp.slnx\` / \`docs/\` | Matches generators |"
            echo "| Test results (TRX) | Artifact \`ci-test-results-${{ github.run_id }}\` (one \`.trx\` per test project) |"
            echo "| Studio CI build | Artifact \`studio-ci-${{ github.run_id }}\` — \`linux-x64/RoboSharp.Studio\`, \`win-x64/RoboSharp.Studio.exe\` |"
            echo ""
            echo "TUnit writes TRX via Microsoft.Testing.Platform (\`--report-trx\`); open \`.trx\` in Visual Studio Test Explorer or upload to Azure Pipelines."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: GitHub prerelease (main)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json', 'RoboSharp.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Write prerelease description
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          DOCS_ROOT="${SERVER_URL}/${REPO}/blob/${SHA}"
          {
            printf '%s\n' "## RoboSharp CI prerelease" ""
            printf '%s\n' "Automated build from \`main\` after tests passed ([workflow run](${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}))." ""
            printf '%s\n' "- **Version metadata:** \`0.0.0-ci.${RUN_NUMBER}\` (informational; not a calendar tag)" ""
            printf '%s\n' "- **Commit:** \`${SHA}\`" ""
            printf '%s\n' "- **Assets:** same layout as [tagged releases](${DOCS_ROOT}/docs/publishing.md) — Studio, Player, Web \`.tar.gz\` plus \`SHA256SUMS.txt\`" ""
            printf '%s\n' "- **Stable / versioned builds:** push a tag \`v*\` to run \`release.yml\`" ""
            printf '%s\n' "---" ""
            printf '%s\n' "*Below: auto-generated notes from recent commits.*"
          } > ci-release-body.md

      - name: Publish host applications
        shell: bash
        env:
          PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          set -euo pipefail
          PUB="$GITHUB_WORKSPACE/release-staging"
          mkdir -p "$PUB"
          for rid in linux-x64 win-x64; do
            for proj in Studio Player; do
              dotnet publish "src/RoboSharp.${proj}/RoboSharp.${proj}.csproj" \
                --configuration Release \
                --runtime "$rid" \
                -p:Version="${PACKAGE_VERSION}" \
                -p:RoboSharpSingleFilePublish=true \
                -o "$PUB/RoboSharp.${proj}-${rid}"
            done
          done
          dotnet publish "src/RoboSharp.Web/RoboSharp.Web.csproj" \
            --configuration Release \
            --runtime linux-x64 \
            -p:Version="${PACKAGE_VERSION}" \
            -o "$PUB/RoboSharp.Web-linux-x64"

      - name: Package artifacts and checksums
        shell: bash
        env:
          RELEASE_TAG: ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          DIST="$GITHUB_WORKSPACE/release-dist"
          mkdir -p "$DIST"
          cd "$GITHUB_WORKSPACE/release-staging"
          for rid in linux-x64 win-x64; do
            for name in Studio Player; do
              tar -czf "$DIST/RoboSharp.${name}-${RELEASE_TAG}-${rid}.tar.gz" "RoboSharp.${name}-${rid}"
            done
          done
          tar -czf "$DIST/RoboSharp.Web-${RELEASE_TAG}-linux-x64.tar.gz" "RoboSharp.Web-linux-x64"
          cd "$DIST"
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_id }}
          name: RoboSharp CI ${{ github.run_number }} (${{ github.run_id }})
          body_path: ci-release-body.md
          prerelease: true
          generate_release_notes: true
          files: |
            release-dist/*.tar.gz
            release-dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
